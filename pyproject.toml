# This service is standalone: it imports nothing from `superset` and runs in
# its own container. It inherits Superset's lint rules and narrows the few
# that assume the Superset package is importable.
[tool.ruff]
extend = "../pyproject.toml"

[tool.ruff.lint.per-file-ignores]
# `superset.utils.json` is not a dependency of this service.
"*.py" = ["TID251"]
# Placeholders are generated from a fixed set of application states and bound
# as parameters; no value reaches these strings from a request.
"app/store.py" = ["S608"]
"tests/*.py" = ["S105", "S106", "S107"]
"scripts/*.py" = ["S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
