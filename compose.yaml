services:
  api:
    build: .
    command: uvicorn app.main:get_app --factory --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_PATH: /data/pipeline.db
    ports:
      - "8000:8000"
    volumes:
      - pipeline-data:/data

  worker:
    build: .
    command: python -m app.worker
    env_file: .env
    environment:
      DATABASE_PATH: /data/pipeline.db
    volumes:
      - pipeline-data:/data
    depends_on:
      - api

volumes:
  # One file, one volume, shared by both processes. This is the arrangement
  # SQLite stops being right for at the point there is a second host.
  pipeline-data:
